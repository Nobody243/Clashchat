name: Automated Release Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Custom release tag (e.g., v1.0.3). Leave empty to use pubspec version.'
        required: false
        default: ''
      is_prerelease:
        description: 'Mark this release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build, Package & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract App Version from pubspec.yaml
        id: get_version
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          VERSION_NAME=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$RAW_VERSION" | cut -s -d'+' -f2)
          
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v$VERSION_NAME"
          fi

          echo "raw_version=$RAW_VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          
          echo "App Version: $RAW_VERSION (Tag: $TAG_NAME)"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter Stable SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Build Configurations & Secure Assets
        # All three values MUST come from repository secrets. There are intentionally
        # no fallbacks here: baking credentials into the workflow file leaks them into
        # git history and the public web bundle.
        env:
          APP_SHARED_SECRET: ${{ secrets.APP_SHARED_SECRET }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          FB_B64: ${{ secrets.FIREBASE_OPTIONS_B64 }}
          GS_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
        run: |
          missing=0
          for var in APP_SHARED_SECRET FB_B64 GS_B64; do
            if [ -z "${!var}" ]; then
              echo "::error::Required secret for $var is not set in repository secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Set APP_SHARED_SECRET, FIREBASE_OPTIONS_B64 and GOOGLE_SERVICES_B64 under Settings > Secrets and variables > Actions."
            exit 1
          fi

          {
            echo "APP_SHARED_SECRET=$APP_SHARED_SECRET"
            if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"; fi
          } > env
          mkdir -p lib android/app
          echo "$FB_B64" | base64 -d > lib/firebase_options.dart
          echo "$GS_B64" | base64 -d > android/app/google-services.json

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Web Production Release
        run: flutter build web --release

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Package Release Distribution Assets
        run: |
          mkdir -p dist
          TAG="${{ steps.get_version.outputs.tag_name }}"
          
          # 1. Copy and rename Android APK
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ClashChat-${TAG}-android.apk"
          
          # 2. Compress Web build bundle into zip
          (cd build/web && zip -r "../../dist/ClashChat-${TAG}-web.zip" .)
          
          # 3. Generate SHA-256 Checksums
          cd dist
          sha256sum ClashChat-${TAG}-android.apk ClashChat-${TAG}-web.zip > SHA256SUMS.txt
          cd ..
          
          echo "Distribution artifacts generated in dist/:"
          ls -lh dist/

      - name: Upload Build Artifacts (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: clashchat-release-${{ steps.get_version.outputs.tag_name }}
          path: dist/

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: "ClashChat Release ${{ steps.get_version.outputs.tag_name }}"
          files: |
            dist/ClashChat-${{ steps.get_version.outputs.tag_name }}-android.apk
            dist/ClashChat-${{ steps.get_version.outputs.tag_name }}-web.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ inputs.is_prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
