<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
    The path provided below has to start and end with a slash "/".
    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ClashChat – sharpen your arguments in live debates against an AI opponent. Casual, ranked and coached modes.">
  <meta name="theme-color" content="#0E0E10">
  <meta name="color-scheme" content="dark light">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ClashChat">
  <meta name="google-signin-client_id" content="308163713864-930lujbb5030d0ou9fgh2cr28acm2o3p.apps.googleusercontent.com">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ClashChat – AI Debate Arena</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Branded loading state shown until Flutter paints its first frame. */
    html, body { height: 100%; margin: 0; background: #0E0E10; }
    #cc-loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #0E0E10; color: #F4F2EE;
      font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      transition: opacity 320ms ease-out; z-index: 9999;
    }
    #cc-loader.hide { opacity: 0; pointer-events: none; }
    #cc-loader .mark { width: 56px; height: 56px; position: relative; }
    #cc-loader .mark .b1, #cc-loader .mark .b2 {
      position: absolute; border-radius: 10px;
    }
    #cc-loader .mark .b1 { left: 6px; top: 10px; width: 30px; height: 22px; border: 3px solid #F4F2EE; }
    #cc-loader .mark .b2 { left: 22px; top: 24px; width: 28px; height: 20px; background: #FF5A3C;
      box-shadow: 0 0 0 3px #0E0E10; }
    #cc-loader .word { font-size: 24px; font-weight: 600; letter-spacing: -0.4px; }
    #cc-loader .word span { color: #FF5A3C; }
    #cc-loader .bar { width: 64px; height: 2px; background: #28282C; overflow: hidden; border-radius: 2px; }
    #cc-loader .bar i { display: block; height: 100%; width: 40%; background: #FF5A3C;
      animation: cc-slide 1.2s ease-in-out infinite; }
    @keyframes cc-slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(260%);} }
    @media (prefers-reduced-motion: reduce) { #cc-loader .bar i { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="cc-loader" role="status" aria-label="Loading ClashChat">
    <div class="mark"><div class="b1"></div><div class="b2"></div></div>
    <div class="word">Clash<span>Chat</span></div>
    <div class="bar"><i></i></div>
  </div>

  <script>
    // Remove the HTML loader as soon as Flutter renders its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('cc-loader');
      if (!el) return;
      el.classList.add('hide');
      setTimeout(function () { el.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
